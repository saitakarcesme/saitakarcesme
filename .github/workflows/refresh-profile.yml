name: Refresh public profile statistics

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-statistics
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=10,<12' 'numpy>=1.26,<3'
      - name: Fetch public statistics and render Earth
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/build_digital_earth.py --refresh
      - name: Save refreshed profile graphic
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/profile-stats.json digital-earth.webp
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh public profile statistics'
            git push
          fi
